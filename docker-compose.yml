services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft-server
    restart: unless-stopped
    ports:
      # Puerto de juego privado (protegido contra escaneres)
      - "28475:25565"
    environment:
      # Aceptacion de EULA
      EULA: "TRUE"

      # Motor PaperMC 1.21.1 (alto rendimiento)
      TYPE: "PAPER"
      VERSION: "1.21.1"

      # Soporte para TLauncher y cuentas no-premium
      ONLINE_MODE: "FALSE"

      # CAPA 1: Lista blanca activa (Nadie entra si no esta en la lista)
      ENABLE_WHITELIST: "TRUE"
      ENFORCE_WHITELIST: "TRUE"

      # Plugins automaticos desde Modrinth:
      # - simple-login: contrasenas (/register y /login)
      # - skinsrestorer: skins de Mojang para TLauncher (/skin)
      # - luckperms: gestor de permisos (/tpa, /home)
      # - instant-villager-restock: aldeanos sin bloqueo de compras
      # - easyvtc: ciclar tradeos de aldeanos con Shift+Clic derecho
      # - thizzyz-tree-feller: talar arboles enteros cortando la base
      # - harvestmaster: cosechar y replantar cultivos con clic derecho
      # - gsit: sentarse en escaleras/bloques (/sit, /lay, /crawl)
      # - invisible-frames: marcos invisibles para cofres
      # - fastleafdecay: caida instantanea de hojas al talar
      # - antitrample: no romper huertos al saltar o caminar
      # - playerheaddrops: suelta la cabeza del jugador al morir
      # - damage-indicator: numeros flotantes de dano estilo RPG al golpear
      # - interactivechat: compartir items/inventarios en el chat ([item], [inv])
      # - placeholderapi: soporte de variables para chat y plugins
      # - auraskills: habilidades, estadisticas de fuerza/vida y progresion RPG
      # - levelledmobs: niveles dinamicos, vida escalable y mejor botin en mobs
      MODRINTH_PROJECTS: "simple-login,skinsrestorer,luckperms,instant-villager-restock,easyvtc,thizzyz-tree-feller,harvestmaster,gsit,invisible-frames,fastleafdecay,antitrample,playerheaddrops,damage-indicator,interactivechat,placeholderapi,auraskills,levelledmobs"

      # Plugins automaticos desde SpigotMC (Spiget API):
      # - 19286: Minepacks (Mochilas personales /backpack)
      SPIGET_RESOURCES: "19286"

      # Plugins por descarga directa (compatibilidad garantizada):
      # - EssentialsX & EssentialsXSpawn (GitHub oficial)
      # - TAB de NEZNAMY: interfaz pro, lista TAB, ping en ms y vida en nombres
      # - Sleep-Most: pasar la noche cuando duermen 2 personas fijas (/sm setflag players-required 2)
      # - ProtocolLib: libreria de paquetes requerida por InteractiveChat en 1.21.1
      PLUGINS: |
        https://github.com/EssentialsX/Essentials/releases/download/2.22.0/EssentialsX-2.22.0.jar
        https://github.com/EssentialsX/Essentials/releases/download/2.22.0/EssentialsXSpawn-2.22.0.jar
        https://github.com/NEZNAMY/TAB/releases/download/6.2.0/TAB.v6.2.0.-.Paper.1.20.5.-.1.21.4.jar
        https://github.com/mrgeneralq/sleep-most/releases/download/v5.5.3/sleep-most-5.5.3.jar
        https://github.com/dmulloy2/ProtocolLib/releases/download/5.4.0/ProtocolLib.jar

      # Asignacion de memoria (12 GB para Minecraft en VM de 16 GB RAM)
      MEMORY: "12G"
      INIT_MEMORY: "6G"

      # Flags optimizadas de Aikar para Java Garbage Collection (cero tirones)
      USE_AIKAR_FLAGS: "true"

      # Ajustes de juego y mundo
      DIFFICULTY: "normal"
      MAX_PLAYERS: "15"
      VIEW_DISTANCE: "10"
      SIMULATION_DISTANCE: "4"
      ENABLE_COMMAND_BLOCK: "true"
      CREATE_CONSOLE_IN_PIPE: "true"
      PVP: "true"
      ALLOW_FLIGHT: "true"
      SPAWN_PROTECTION: "0"
      MOTD: "§aServidor Privado §7| §eTLauncher & Premium"

      # Zona horaria
      TZ: "America/Santiago"

    volumes:
      # Persistencia de mundos, plugins y configuraciones en disco
      - ./data:/data

    tty: true
    stdin_open: true