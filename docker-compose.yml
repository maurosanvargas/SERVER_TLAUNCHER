services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft-server
    restart: unless-stopped
    ports:
      # Puerto de juego privado (protegido contra escaneres)
      - "28475:25565"
      # Puerto web de Dynmap (mapa en tiempo real en el navegador)
      - "8123:8123"
    environment:
      # Aceptacion de EULA
      EULA: "TRUE"

      # Motor PaperMC 1.21.1 (alto rendimiento)
      TYPE: "PAPER"
      VERSION: "1.21.1"

      # Soporte para TLauncher y cuentas no-premium
      ONLINE_MODE: "FALSE"

      # CAPA 1: Lista blanca activa (Nadie entra si no esta en la lista)
      ENABLE_WHITELIST: "TRUE"
      ENFORCE_WHITELIST: "TRUE"

      # Plugins automaticos desde Modrinth:
      # - simple-login: contrasenas (/register y /login)
      # - skinsrestorer: skins reales para TLauncher (/skin)
      # - dynmap: mapa web en vivo en el navegador (puerto 8123)
      # - essentialsx: comandos utiles (/sethome, /home, /tpa, /spawn)
      # - luckperms: gestor de permisos para que amigos usen /tpa y /home sin darles OP
      # Plugins automaticos desde Modrinth:
      # - simple-login: contrasenas (/register y /login)
      # - skinsrestorer: skins reales para TLauncher (/skin)
      # - luckperms: gestor de permisos para /tpa y /home
      MODRINTH_PROJECTS: "simple-login,skinsrestorer,luckperms"

      # Plugins por descarga directa (compatibilidad garantizada):
      # - EssentialsX & EssentialsXSpawn (GitHub oficial)
      # - Dynmap (CDN oficial para Paper 1.21.1)
      PLUGINS: |
        https://github.com/EssentialsX/Essentials/releases/download/2.22.0/EssentialsX-2.22.0.jar
        https://github.com/EssentialsX/Essentials/releases/download/2.22.0/EssentialsXSpawn-2.22.0.jar
        https://cdn.modrinth.com/data/fRQREgAc/versions/ImNNT17B/Dynmap-3.7-beta-8-spigot.jar

      # Asignacion de memoria (3 GB para Minecraft en VM de 4 GB RAM)
      MEMORY: "3G"
      INIT_MEMORY: "2G"

      # Flags optimizadas de Aikar para Java Garbage Collection (cero tirones)
      USE_AIKAR_FLAGS: "true"

      # Ajustes de juego y mundo
      DIFFICULTY: "normal"
      MAX_PLAYERS: "15"
      VIEW_DISTANCE: "10"
      SIMULATION_DISTANCE: "6"
      ENABLE_COMMAND_BLOCK: "true"
      CREATE_CONSOLE_IN_PIPE: "true"
      PVP: "true"
      ALLOW_FLIGHT: "true"
      SPAWN_PROTECTION: "0"
      MOTD: "§aServidor Privado §7| §eTLauncher & Premium"

      # Zona horaria
      TZ: "America/Santiago"

    volumes:
      # Persistencia de mundos, plugins y configuraciones en disco
      - ./data:/data

    tty: true
    stdin_open: true