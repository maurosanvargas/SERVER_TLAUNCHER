services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft-server
    restart: unless-stopped
    ports:
      - "25565:25565"
    environment:
      # Aceptación de EULA
      EULA: "TRUE"

      # Motor PaperMC (alto rendimiento, optimizado para evitar lag)
      TYPE: "PAPER"
      VERSION: "1.21.1"

      # Soporte para TLauncher y cuentas no-premium
      ONLINE_MODE: "FALSE"

      # Asignación de memoria (3 GB para Minecraft en VM de 4 GB RAM)
      MEMORY: "3G"
      INIT_MEMORY: "2G"

      # Flags optimizadas de Aikar para Java Garbage Collection (cero tirones)
      USE_AIKAR_FLAGS: "true"

      # Ajustes de juego y mundo
      DIFFICULTY: "normal"
      MAX_PLAYERS: "10"
      VIEW_DISTANCE: "10"
      SIMULATION_DISTANCE: "6"
      ENABLE_COMMAND_BLOCK: "true"
      PVP: "true"
      ALLOW_FLIGHT: "true"
      SPAWN_PROTECTION: "0"
      MOTD: "§aServidor de Minecraft §7| §eTLauncher & Premium"

      # Zona horaria
      TZ: "America/Santiago"

    volumes:
      # Persistencia de mundos, plugins y configuraciones en disco
      - ./data:/data

    tty: true
    stdin_open: true
